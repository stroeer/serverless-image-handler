name: main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.tf"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.tf"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# read+write needed for `aws-actions/configure-aws-credentials` to work
permissions:
  id-token: write
  contents: read

jobs:
  image-handler:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'source/image-handler/package-lock.json'

      - name: build
        run: make build

      - name: configure aws credentials
        # 📌 Runs only if:
        # 1. is a 'push to main'
        # 2. did not run in a fork
        if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'stroeer' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::053041861227:role/github-actions-serverless-image-handler-eu-west-1
          role-session-name: GitHubActions
          aws-region: eu-west-1

      - name: s3 upload artefact
        # 📌 Runs only if:
        # 1. is a 'push to main'
        # 2. did not run in a fork
        if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'stroeer' }}
        run: make deploy